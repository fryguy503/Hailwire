services:
  relay:
    build:
      context: ../relay
      dockerfile: ../deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      HAILWIRE_BIND: 0.0.0.0
      HAILWIRE_PORT: "8787"
      HAILWIRE_DATA_DIR: /var/lib/hailwire
      HAILWIRE_TRUST_PROXY: "1"
    volumes:
      - relay-data:/var/lib/hailwire
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      HAILWIRE_DOMAIN: ${HAILWIRE_DOMAIN:?Set the public relay DNS name in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  relay-data:
  caddy-data:
  caddy-config:
